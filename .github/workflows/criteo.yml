name: Criteo frozen Cycle 018 replication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/criteo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: criteo-frozen-benchmark
  cancel-in-progress: false
jobs:
  eight-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile original frozen runner
        run: python -m py_compile c018_runner.py
      - name: Fetch source with retries
        run: |
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 -o criteo_attribution_dataset.tsv.gz https://huggingface.co/datasets/criteo/criteo-attribution-dataset/resolve/main/criteo_attribution_dataset.tsv.gz
      - name: Verify official byte count and SHA-256
        run: |
          test "$(stat -c %s criteo_attribution_dataset.tsv.gz)" = "653015824"
          echo "94ac7a465564349bc7ba008602211d5990a3c53cc133abc0aadef61ea2391a98  criteo_attribution_dataset.tsv.gz" | sha256sum --check --status
      - name: Evaluate frozen eight baselines on development only
        run: |
          python -u c018_runner.py --input criteo_attribution_dataset.tsv.gz --out criteo_dev_metrics.json --sample-every 10
      - name: Delete original dataset
        if: always()
        run: rm -f criteo_attribution_dataset.tsv.gz
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criteo-frozen-cycle018-development-metrics
          path: criteo_dev_metrics.json
          if-no-files-found: warn
          retention-days: 2
