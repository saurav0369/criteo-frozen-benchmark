name: Criteo real-data CPU benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/criteo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: criteo-frozen-benchmark
  cancel-in-progress: false
jobs:
  eight-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runner
        run: python -m py_compile run_criteo.py
      - name: Verify official source and evaluate development only
        run: python -u run_criteo.py
      - name: Delete original dataset and partial source
        if: always()
        run: rm -f criteo_attribution_dataset.tsv.gz criteo_attribution_dataset.tsv.gz.part
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criteo-development-metrics
          path: criteo_dev_metrics.json
          if-no-files-found: warn
          retention-days: 2
